name: Add an accepted suggestion

# When a maintainer labels a "Suggest a tool" issue `accepted`, its answers
# are checked and added to tools.json, then the issue is closed.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  add:
    if: github.event.label.name == 'accepted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: add
        # the issue text is untrusted: it goes in through env, never into the script
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/from-issue.mjs
      - name: Commit
        if: success()
        env:
          TOOL_NAME: ${{ steps.add.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node scripts/validate.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools.json
          git commit -m "Add $TOOL_NAME (#$ISSUE_NUMBER)"
          git push
      - name: Thank and close
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Added to the list. SkillScout picks it up within the hour. Thank you."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
      - name: Explain what to fix
        if: failure() && steps.add.outputs.error != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ERRORS: ${{ steps.add.outputs.error }}
        run: |
          printf 'This one could not be added yet:\n\n%s\n\nEdit the issue, then remove and re-add the `accepted` label.\n' "$ERRORS" > msg.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file msg.md
